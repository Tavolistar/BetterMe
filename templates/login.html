{% extends "base.html" %}

{% block title %}BetterMe - Iniciar Sesión{% endblock %}

{% block page_content %}
<div class="container">
    <!-- Outer Row -->
    <div class="row justify-content-center">
        <div class="col-xl-10 col-lg-12 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <!-- Nested Row within Card Body -->
                    <div class="row">
                        <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
                        <div class="col-lg-6">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">
                                        <i class="fas fa-leaf text-primary"></i> BetterMe
                                    </h1>
                                    <p class="mb-4">¡Bienvenido de nuevo! Inicia sesión para continuar.</p>
                                </div>

                                <form class="user" method="POST" action="{{ url_for('login') }}">
                                    <div class="form-group">
                                        <input type="email" class="form-control form-control-user"
                                               name="email" id="loginEmail"
                                               placeholder="Correo electrónico" required>
                                    </div>
                                    <div class="form-group">
                                        <input type="password" class="form-control form-control-user"
                                               name="password" id="loginPassword"
                                               placeholder="Contraseña" required>
                                    </div>
                                    <div class="form-group">
                                        <div class="custom-control custom-checkbox small">
                                            <input type="checkbox" class="custom-control-input" name="remember" id="customCheck">
                                            <label class="custom-control-label" for="customCheck">Recordarme</label>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-user btn-block">
                                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                                    </button>
                                </form>
                                <hr>
                                <div class="text-center">
                                    <a class="small" href="{{ url_for('reset_password') }}">¿Olvidaste tu contraseña?</a>
                                </div>
                                <div class="text-center">
                                    <a class="small" href="{{ url_for('register') }}">¿No tienes cuenta? ¡Regístrate!</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_head %}
<style>
    .bg-login-image {
        background: url("{{ url_for('static', filename='img/undraw_profile.svg') }}");
        background-position: center;
        background-size: cover;
    }
</style>
{% endblock %}
