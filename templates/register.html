{% extends "base.html" %}

{% block title %}BetterMe - Registro{% endblock %}

{% block page_content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-10 col-lg-12 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <div class="row">
                        <div class="col-lg-6 d-none d-lg-block bg-register-image"></div>
                        <div class="col-lg-6">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">
                                        <i class="fas fa-leaf text-primary"></i> BetterMe
                                    </h1>
                                    <p class="mb-4">Crea tu cuenta y comienza a mejorar.</p>
                                </div>

                                <form class="user" method="POST" action="{{ url_for('register') }}">
                                    <div class="form-group">
                                        <input type="text" class="form-control form-control-user"
                                               name="name" id="registerName"
                                               placeholder="Nombre completo" required>
                                    </div>
                                    <div class="form-group">
                                        <input type="email" class="form-control form-control-user"
                                               name="email" id="registerEmail"
                                               placeholder="Correo electrónico" required>
                                    </div>
                                    <div class="form-group row">
                                        <div class="col-sm-6 mb-3 mb-sm-0">
                                            <input type="password" class="form-control form-control-user"
                                                   name="password" id="registerPassword"
                                                   placeholder="Contraseña (mín. 6 caracteres)" required minlength="6">
                                        </div>
                                        <div class="col-sm-6">
                                            <input type="password" class="form-control form-control-user"
                                                   name="confirm_password" id="registerConfirmPassword"
                                                   placeholder="Repetir contraseña" required minlength="6">
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-primary btn-user btn-block">
                                        <i class="fas fa-user-plus"></i> Registrarse
                                    </button>
                                </form>
                                <hr>
                                <div class="text-center">
                                    <a class="small" href="{{ url_for('login') }}">¿Ya tienes cuenta? ¡Inicia sesión!</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_head %}
<style>
    .bg-register-image {
        background: url("{{ url_for('static', filename='img/undraw_posting_photo.svg') }}");
        background-position: center;
        background-size: cover;
    }
</style>
{% endblock %}
