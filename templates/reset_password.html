{% extends "base.html" %}

{% block title %}BetterMe - Recuperar Contraseña{% endblock %}

{% block page_content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-8 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">
                                        <i class="fas fa-leaf text-primary"></i> BetterMe
                                    </h1>
                                    <p class="mb-4">
                                        <i class="fas fa-lock fa-3x text-primary mb-3"></i>
                                    </p>
                                    <p class="mb-4">¿Olvidaste tu contraseña? Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
                                </div>

                                <form class="user" method="POST" action="{{ url_for('reset_password') }}">
                                    <div class="form-group">
                                        <input type="email" class="form-control form-control-user"
                                               name="email" id="resetEmail"
                                               placeholder="Correo electrónico" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-user btn-block">
                                        <i class="fas fa-paper-plane"></i> Enviar enlace de recuperación
                                    </button>
                                </form>
                                <hr>
                                <div class="text-center">
                                    <a class="small" href="{{ url_for('login') }}">Volver a inicio de sesión</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
