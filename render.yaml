services:
  - type: web
    name: betterme
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: betterme-db
          property: connectionString

databases:
  - name: betterme-db
    databaseName: betterme
    plan: free
